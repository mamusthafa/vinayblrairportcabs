<div class="fleet-card" id="{{ include.vehicle.id }}">
  <div class="fleet-card-img-wrap">
    <img src="{{ site.baseurl }}/{{ include.vehicle.image }}" alt="{{ include.vehicle.name }} — {{ include.vehicle.models }} Bangalore Airport Cab" loading="lazy" width="600" height="340">
    <span class="fleet-badge">{{ include.vehicle.category }}</span>
  </div>
  <div class="fleet-card-body">
    <h3>{{ include.vehicle.name }}</h3>
    <div class="fleet-models">{{ include.vehicle.models }}</div>

    <div class="fleet-specs-grid">
      <div class="fleet-spec-item">
        <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        <span>Capacity: {{ include.vehicle.capacity }}</span>
      </div>
    </div>

    <p>{{ include.vehicle.description }}</p>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px;">
      <a href="https://wa.me/919180182667?text=Hi%20BLR%20Airport%20Cab%2C%20I%20would%20like%20to%20enquire%20about%20booking%20a%20{{ include.vehicle.name | url_encode }}.%20Please%20share%20the%20fare%20quote." class="btn btn-whatsapp btn-full" target="_blank" rel="noopener noreferrer" data-track-location="fleet_card_wa">
        Enquire on WhatsApp &rarr;
      </a>
      <a href="{{ site.baseurl }}/contact/?vehicle={{ include.vehicle.id }}" class="btn btn-outline-primary btn-sm btn-full">
        Check Availability &amp; Rate
      </a>
    </div>
  </div>
</div>
