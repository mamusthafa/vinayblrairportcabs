<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- SEO Primary Metadata -->
  <title>{{ page.title | default: "Bangalore Airport Taxi Service | 24/7 Pickup & Drop | BLR Airport Cab" | escape }}</title>
  <meta name="description" content="{{ page.description | default: "Book dependable Bangalore Airport Taxi service for Kempegowda International Airport (BLR). 24/7 airport pickup & drop, local cab packages & outstation trips. Call +91 9845798106." | escape }}">
  {% if page.keywords %}<meta name="keywords" content="{{ page.keywords | escape }}">{% endif %}
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="{{ site.url }}{{ page.url }}">

  <!-- Favicon & Touch Icons -->
  <link rel="icon" type="image/svg+xml" href="{{ site.baseurl }}/assets/images/favicon.svg">
  <meta name="theme-color" content="#10243A">

  <!-- Open Graph / Facebook / WhatsApp -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="BLR Airport Cab">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <meta property="og:title" content="{{ page.og_title | default: page.title | escape }}">
  <meta property="og:description" content="{{ page.og_description | default: page.description | escape }}">
  <meta property="og:image" content="{{ site.url }}/assets/images/blr-airport-cab-og.jpg">
  <meta property="og:image:secure_url" content="{{ site.url }}/assets/images/blr-airport-cab-og.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="BLR Airport Cab — Kempegowda Bangalore Airport Taxi Service 24/7">
  <meta property="og:locale" content="en_IN">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="{{ site.url }}{{ page.url }}">
  <meta name="twitter:title" content="{{ page.title | escape }}">
  <meta name="twitter:description" content="{{ page.description | escape }}">
  <meta name="twitter:image" content="{{ site.url }}/assets/images/blr-airport-cab-og.jpg">
  <meta name="twitter:image:alt" content="BLR Airport Cab — Kempegowda Bangalore Airport Taxi Service 24/7">

  <!-- Preconnect & Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/main.css">
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/responsive.css">

  <!-- Structured Data JSON-LD (TaxiService Schema) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "TaxiService",
    "name": "BLR Airport Cab",
    "legalName": "BLR Airport Cab Bengaluru",
    "url": "https://blrairportcab.com",
    "logo": "https://blrairportcab.com/assets/images/logo.svg",
    "image": "https://blrairportcab.com/assets/images/blr-airport-cab-og.jpg",
    "description": "24/7 Bangalore Airport Taxi service between Bengaluru City and Kempegowda International Airport (BLR). Airport Pickup & Drop, Local Packages and Outstation Cabs.",
    "telephone": "+919845798106",
    "email": "vinaygowdapr1982@gmail.com",
    "priceRange": "₹₹",
    "currenciesAccepted": "INR",
    "paymentAccepted": "Cash, UPI, Google Pay, PhonePe, Paytm, Net Banking",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Bengaluru",
      "addressRegion": "Karnataka",
      "postalCode": "560001",
      "addressCountry": "IN"
    },
    "geo": {
      "@type": "GeoCoordinates",
      "latitude": 13.1986,
      "longitude": 77.7066
    },
    "areaServed": [
      {
        "@type": "City",
        "name": "Bengaluru"
      },
      {
        "@type": "Airport",
        "name": "Kempegowda International Airport Bengaluru (BLR)"
      }
    ],
    "openingHoursSpecification": {
      "@type": "OpeningHoursSpecification",
      "dayOfWeek": [
        "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"
      ],
      "opens": "00:00",
      "closes": "23:59"
    }
  }
  </script>
</head>
<body>
  <!-- Global Shared Header -->
  {% include header.html %}

  <!-- Main Content Anchor -->
  <main id="main-content">
    {{ content }}
  </main>

  <!-- Global Shared Footer -->
  {% include footer.html %}

  <!-- Sticky Mobile Conversion Bar & Modal -->
  {% include sticky-cta.html %}

  <!-- Core Scripts -->
  <script defer src="{{ site.baseurl }}/assets/js/tracking.js"></script>
  <script defer src="{{ site.baseurl }}/assets/js/booking.js"></script>
  <script defer src="{{ site.baseurl }}/assets/js/main.js"></script>
</body>
</html>
